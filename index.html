<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheeset's Game Hub</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --muted: #8b949e;
      --heavy-tag: #da3633;
      --papas-tag: #d29922;
      --original-tag: #238636;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid var(--card-border);
      padding: 2rem 1.5rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background-color: rgba(22, 27, 34, 0.9);
    }

    header h1 {
      color: var(--text-bright);
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      max-width: 1200px;
      margin: 1.5rem auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-bright);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .filter-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-hover);
      color: white;
      border-color: var(--accent-hover);
    }

    main {
      max-width: 1300px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-bright);
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-weight: bold;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-heavy { background: var(--heavy-tag); color: white; }
    .badge-papas { background: var(--papas-tag); color: black; }
    .badge-original { background: var(--original-tag); color: white; }
    .badge-fork { background: var(--card-border); color: var(--text); }
    .badge-resource { background: #8957e5; color: white; }

    .card-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      line-height: 1.4;
      flex: 1;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
    }

    .btn-primary:hover {
      background: #79c0ff;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--card-border);
      color: var(--text-bright);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 90%;
      max-width: 1200px;
      height: 85vh;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
    }

    .modal-header {
      padding: 0.75rem 1.25rem;
      background: #161b22;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      color: var(--text-bright);
      font-weight: 600;
    }

    .modal-controls {
      display: flex;
      gap: 0.5rem;
    }

    .modal-btn {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .modal-btn:hover {
      background: var(--card-border);
      color: white;
    }

    .modal-body {
      flex: 1;
      position: relative;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      border-top: 1px solid var(--card-border);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Cheeset's Game Hub</h1>
    <p>All original games, forks, and WebGL ports in one place!</p>
    
    <div class="controls">
      <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Search games or notes..." oninput="filterGames()" />
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="setCategory('All', this)">All</button>
        <button class="filter-btn" onclick="setCategory('Original Projects', this)">Originals</button>
        <button class="filter-btn" onclick="setCategory('Forks & Web Games', this)">Forks</button>
        <button class="filter-btn" onclick="setCategory('Papa\'s Series', this)">Papa's</button>
        <button class="filter-btn" onclick="setCategory('Heavy Games', this)">Heavy</button>
        <button class="filter-btn" onclick="setCategory('Resources', this)">Resources</button>
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="gameGrid"></div>
  </main>

  <footer>
    <p>Hosted with GitHub Pages • Created by Cheeset</p>
  </footer>

  <!-- Embedded Game Modal Player -->
  <div class="modal-overlay" id="playerModal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modalGameTitle">Playing Game</span>
        <div class="modal-controls">
          <button class="modal-btn" onclick="toggleFullscreen()">Fullscreen ⛶</button>
          <button class="modal-btn" onclick="reloadIframe()">Reload 🔄</button>
          <a id="modalExternalLink" class="modal-btn" target="_blank" href="#">New Tab ↗</a>
          <button class="modal-btn" style="background:#da3633; color:white;" onclick="closeGame()">Close ✖</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="gameIframe" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

    let currentCat = "All";

    function getBadgeClass(cat, heavy) {
      if (heavy) return "badge-heavy";
      if (cat === "Original Projects") return "badge-original";
      if (cat === "Papa's Series") return "badge-papas";
      if (cat === "Resources") return "badge-resource";
      return "badge-fork";
    }

    function renderGames(list) {
      const grid = document.getElementById("gameGrid");
      grid.innerHTML = "";

      if (list.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 3rem;">No games found matching your search.</p>`;
        return;
      }

      list.forEach(game => {
        const badgeClass = getBadgeClass(game.category, game.heavy);
        const badgeLabel = game.heavy ? "Heavy Load" : game.category;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="card-title">${game.title}</span>
              <span class="badge ${badgeClass}">${badgeLabel}</span>
            </div>
            <div class="card-desc">${game.desc || "Click below to play or open in a new tab."}</div>
          </div>
          <div class="card-actions">
            ${game.category === 'Resources' ? '' : `<button class="btn btn-primary" onclick="embedGame('${game.url.replace(/'/g, "\\'")}', '${game.title.replace(/'/g, "\\'")}')">Play Here</button>`}
            <a href="${game.url}" target="_blank" class="btn btn-secondary">${game.category === 'Resources' ? 'Open Drive' : 'New Tab ↗'}</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterGames() {
      const query = document.getElementById("search").value.toLowerCase();
      const filtered = games.filter(g => {
        const matchesCat = currentCat === "All" || g.category === currentCat;
        const matchesQuery = g.title.toLowerCase().includes(query) || g.desc.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });
      renderGames(filtered);
    }

    function setCategory(cat, btn) {
      currentCat = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterGames();
    }

    function embedGame(url, title) {
      document.getElementById("modalGameTitle").innerText = title;
      document.getElementById("gameIframe").src = url;
      document.getElementById("modalExternalLink").href = url;
      document.getElementById("playerModal").style.display = "flex";
    }

    function closeGame() {
      document.getElementById("gameIframe").src = "";
      document.getElementById("playerModal").style.display = "none";
    }

    function reloadIframe() {
      const iframe = document.getElementById("gameIframe");
      iframe.src = iframe.src;
    }

    function toggleFullscreen() {
      const iframe = document.getElementById("gameIframe");
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    }

    // Initial render
    renderGames(games);
  </script>
</body>
</html>
